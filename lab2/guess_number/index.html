<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="js/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    </head>
    <body>

        <header>
            <h1>Guess the Number!</h1>
            <h2>Guess a number between 1 and 99 in seven attempts!</h2>
        </header>
        <br>
        <div id="main">
          Enter a guess: 
          <!-- this creates a text box -->
          <input type="text" id="playerGuess" size="8"> 
          <!-- this creates a button     -->
          <button class="gameBtn" id="guessBtn"> Guess </button> <br>
          <button class="gameBtn" id="resetBtn"> Reset </button> 
          <br>
        </div>
        <div id="feedback"></div>
        <div id="prevGuess"> Previous Guesses: 
            <span id="guesses"></span>
        </div>
        <div id="attempts"> Attempts Left: 
            <span id="attemptsLeft"></span>
        </div>
        <div id="scoreboard">
            Wins: <span id="numOfWins"></span>
            / Losses: <span id="numOfLosses"></span>
        </div>
        <script src="js/script.js"></script>
        <footer>
            <hr>

                <strong>Disclaimer:</strong> The information in this webpage is fictitious. <br>
                It is used for academic purposes only.
        </footer>
    </body>

</html>
